name: 'CI'

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

# A run on master is never cancelled: the Release workflow starts from its completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Each run checks every package. The packages depend on each other through peerDependencies, which
  # `yarn workspaces list --since --recursive` does not follow, so a list of changed packages would leave out the
  # dependents of a changed package.
  packages:
    name: 'List packages'
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Setup Vite+'
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: 26
          run-install: false
      - name: 'List workspace packages'
        id: list
        run: |
          packages=$(yarn workspaces list --json | jq --slurp --compact-output 'map(select(.location != "."))')
          echo "$packages"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  format:
    name: 'Format'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Setup Vite+ and install dependencies'
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: 26
          cache: true
      - name: 'Check formatting'
        run: vp fmt --check

  lint:
    name: 'Lint (${{ matrix.package.name }})'
    needs: packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.packages.outputs.packages) }}
    steps:
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Setup Vite+ and install dependencies'
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: 26
          cache: true
      - name: 'Lint'
        env:
          PACKAGE: ${{ matrix.package.name }}
        run: yarn workspace "$PACKAGE" lint --format github

  build:
    name: 'Build (${{ matrix.package.name }})'
    needs: packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.packages.outputs.packages) }}
    steps:
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Setup Vite+ and install dependencies'
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: 26
          cache: true
      - name: 'Build'
        env:
          PACKAGE: ${{ matrix.package.name }}
        run: yarn workspace "$PACKAGE" build

  test:
    name: 'Test (${{ matrix.package.name }})'
    needs: packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.packages.outputs.packages) }}
    steps:
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Setup Vite+ and install dependencies'
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: 26
          cache: true
      - name: 'Test'
        env:
          PACKAGE: ${{ matrix.package.name }}
        run: >-
          yarn workspace "$PACKAGE" test:coverage
          --reporter='github-actions'
          --reporter='junit'
          --outputFile='./coverage/test-report.junit.xml'
          --reporter=default
      - name: 'Upload coverage to Codecov'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ${{ matrix.package.location }}/coverage
          flags: ${{ matrix.package.name }}
          fail_ci_if_error: false
      - name: 'Upload test results to Codecov'
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: ${{ matrix.package.location }}/coverage/test-report.junit.xml
          flags: ${{ matrix.package.name }}
          fail_ci_if_error: false

  # The protect-master ruleset requires the status check of this job and of no other, so the ruleset does not list the
  # per-package jobs. The job passes only when each job it needs passed.
  ci-ok:
    name: 'ci-ok'
    if: always()
    needs: [packages, format, lint, build, test]
    runs-on: ubuntu-latest
    steps:
      - name: 'Check that each job passed'
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          jq --exit-status 'all(. == "success")' <<< "$RESULTS"

  # The merge waits for ci-ok: the ruleset rejects a merge while the required status check is pending.
  dependabot-merge:
    name: 'Dependabot automerge'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    needs: [ci-ok]
    if: github.actor == 'dependabot[bot]' && github.event_name == 'pull_request'
    steps:
      - name: 'Automerge Dependabot PR'
        uses: fastify/github-action-merge-dependabot@73ec4cbb5e56df5591eae286972d5b2201ffe90f # v3.15.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
