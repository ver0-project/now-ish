name: 'Release'

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: 'Release'
    runs-on: ubuntu-latest
    # A pull request from a fork branch named master also matches the branch filter, so the CI run must come from a push.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    permissions:
      id-token: write
      pull-requests: write
      contents: write
    steps:
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          # GitHub starts no workflow for a push or a pull request that the job token made, and the version pull
          # request needs a CI run to pass the ci-ok check. The GH_TOKEN secret holds a personal access token.
          token: ${{ secrets.GH_TOKEN }}
      # No dependency cache: a pull request branch can write the Actions cache, and this job publishes.
      - name: 'Setup Vite+ and install dependencies'
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: 26
      - name: 'Build'
        run: yarn workspaces foreach -A run build
      - name: 'Create Release PR or Publish'
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        # `yarn run` is required: `yarn version` alone is the built-in Yarn command, which shadows the script.
        with:
          publish: yarn run release
          version: yarn run version
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
